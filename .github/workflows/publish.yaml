name: Quality Checks

on:
  workflow_call:

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: "Setup PDM"
        uses: pdm-project/setup-pdm@v4
        with:
          cache: true
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: pdm install --frozen-lockfile --group dev

      - name: Build
        run: pdm build

      - name: Publish
        run: pdm publish